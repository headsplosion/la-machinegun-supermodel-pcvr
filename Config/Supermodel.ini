; Supermodel VR (PC) settings.
; Light guns are driven like a mouse, the same way desktop Supermodel plays them with a
; mouse or the Steam Deck touchpad: in VR the controller you shoot with becomes that mouse.

[ Global ]
New3DEngine = 1
MultiThreaded = 1
GPUMultiThreaded = 1
RefreshRate = 60
Crosshairs = 0
ShowFrameRate = 0

; --- VR tuning (used with -vr) ---
VRWorldUnitsPerMeter = 1.0
VRPositionalTracking = 1
VRHudDistance = 20.0
VRResolutionScale = 1.0
VRMaxEyeWidth = 1664
VRRefreshHz = 120
VRPointer = 0
VRHideLetterbox = 1
VRMirror = 1
VRAsyncFrames = 1
; Score, timer and on-screen text: 2 = follow your head during play and cutscenes, stay
; fixed in the room on menus and title screens; 1 = always follow the head; 0 = always fixed
VRHudLock = 2
; 1 = hide player 2's "PRESS START BUTTON" in the corner during play (single player)
VRHideP2Prompt = 1
; 1 = when you're hit, the game's "static" fills your whole view, not just the 4:3 screen
VRStaticFill = 1
; The options below can also be changed in the headset (left controller's menu button).
VRVignette = 2
VRCinema = 0
VRCinemaSize = 1
VRGunHand = 0
VRRecoil = 1
VRAimNudgeX = 0.00
VRAimNudgeY = 0.00
VRHudFilter = 1
; Gun calibration: the VR build writes L.A. Machineguns' AIM SET range into the game's
; memory (the middle half of the gun's travel), so the game aims a screen-width past each
; edge of its 4:3 screen and the whole view in the headset can be shot at. 0 = off.
VRGunCalibration = 1
; Gun correction for that calibration: gun position = where you point * scale + offset, so
; the game's crosshair lands exactly where the controller points (measured from the game's
; own crosshair). Leave as is unless you change VRGunCalibration.
VRAimScaleX = 0.5099
VRAimOffsetX = 0.2434
VRAimScaleY = 0.5088
VRAimOffsetY = 0.2476

; --- Inputs ---
InputStart1 = "KEY_1,JOY1_BUTTON9"
InputCoin1 = "KEY_3,JOY1_BUTTON10"
InputServiceA = "KEY_0"
InputTestA = "KEY_9"
InputAnalogGunX = "MOUSE_XAXIS"
InputAnalogGunY = "MOUSE_YAXIS"
InputAnalogTriggerLeft = "MOUSE_LEFT_BUTTON"
InputAnalogTriggerRight = "MOUSE_RIGHT_BUTTON"
